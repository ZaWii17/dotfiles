# set color 
set $active_border #37353E
set $inactive_border #44444E 
set $background #44444E
set $text #D3DAD9
set $indicator #715A5A

# title bar
default_floating_border pixel 0
default_border pixel 0

# class
client.focused $active_border $background $text $active_border $active_border
client.focused_inactive $inactive_border $background $text $inactive_border $inactive_border
client.unfocused $inactive_border $background $text $inactive_border $inactive_border
client.focused_tab_title $active_border $background $text $inactive_border $active_border

#border
corner_radius 10

# Gaps
gaps inner 4px
gaps outer 2px

# blur
blur enable
default_dim_inactive 0.0

# shadow
shadows enable
shadow_blur_radius 15
shadow_color #0000007F
