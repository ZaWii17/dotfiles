# Catppuccin Macchiato
set $base      #24273a
set $surface0  #363a4f
set $surface1  #494d64
set $text      #cad3f5
set $subtext0  #a5adcb
set $blue      #8aadf4
set $lavender  #b7bdf8
set $red       #ed8796

# Windows:              border,     background,     text,
client.focused          $base       $base           $text
client.focused_inactive $base       $surface1       $text
client.unfocused        $base       $surface1       $text
client.urgent           $base       $base           $text
client.placeholder      $base       $base           $text

# Border
default_border pixel 0
default_floating_border pixel 0

# Gaps
gaps inner 3px
gaps outer 3px


